version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # No lock file is committed, so an update is a change to the constraint
    # in composer.json. "increase" raises it to each new release, majors
    # included, instead of waiting until a release falls outside the range.
    versioning-strategy: "increase"
    groups:
      all-composer:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-github-actions:
        patterns:
          - "*"
